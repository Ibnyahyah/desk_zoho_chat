name: desk_zoho_chat
description: A Flutter plugin to integrate Zoho Desk Support in your Flutter app. It provides an easy-to-use API for communicating with the Zoho Desk platform to provide in-app chat functionality for customer support.
version: 1.0.2
homepage: https://www.github.com/ibnyahyah/desk_zoho_chat

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.whitecoode.desk_zoho_chat
        pluginClass: DeskZohoChatPlugin
      ios:
        pluginClass: DeskZohoChatPlugin

  assets:
    - packages/desk_zoho_chat/assets/index.html
    - packages/desk_zoho_chat/assets/index2.html
