<html>
  <head>

    <link
      href="https://fonts.googleapis.com/css?family=Roboto"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      body {
        font-family: "Roboto", arial, serif;
      }
      p {
        font-family: "Roboto", arial, serif;
      }

      .welcome-text {
        margin: auto;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 24px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="welcome-text">
      Welcome to Zoho Desk
    </div>
    <script>
      // Initialize the ZOHOIM object if it doesn't already exist
      window.ZOHOIM =
        window.ZOHOIM ||
        function (a, b) {
          ZOHOIM[a] = b;
        };
    </script>
  </body>
</html>
