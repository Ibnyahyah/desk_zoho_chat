<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto"
      rel="stylesheet"
      type="text/css"
    />

    <style>
      body {
        font-family: "Roboto", arial, serif;
      }
      p {
        font-family: "Roboto", arial, serif;
      }

      .loader {
        border: 1px solid #f3f3f3; /* Light grey */
        border-top: 1px solid #000000; /* Black */
        border-radius: 50%;
        width: 120px;
        height: 120px;
        animation: spin 2s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .box-content {
        margin: auto;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        position: absolute;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <center>
      <div class="loader box-content"></div>
    </center>
    <script type="text/javascript">
      console.log("Start ---- index2.html");

      window.ZOHOIM =
        window.ZOHOIM ||
        function (a, b) {
          ZOHOIM[a] = b;
        };

      window.ZOHOIM.prefilledMessage = "";

      function initialize() {
        var s = document.createElement("script");
        s.type = "text/javascript";
        s.src = `https://im.zoho.com/api/v1/public/channel/${zohoAppID}/widget`;
        s.onload = function (arg) {
          console.error("Script loaded:", arg);
        };
        s.onerror = function (error) {
          console.error("Script load error:", error);
        };
        document.getElementsByTagName("head")[0].appendChild(s);
      }

      window.addEventListener("DOMContentLoaded", initialize);

      console.log("end ---- index2.html");
    </script>
  </body>
</html>
