<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto"
      rel="stylesheet"
      type="text/css"
    />

    <style>
      body {
        font-family: "Roboto", arial, serif;
      }
      p {
        font-family: "Roboto", arial, serif;
      }

      .welcome-text {
        margin: auto;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 24px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="welcome-text">Welcome to Zoho Desk</div>
    <script type="text/javascript">
      console.log("Start ---- index2.html");

      window.ZOHOIM =
        window.ZOHOIM ||
        function (a, b) {
          ZOHOIM[a] = b;
        };

      window.ZOHOIM.prefilledMessage = "";

      function initialize() {
        var s = document.createElement("script");
        s.type = "text/javascript";
        s.src = `https://im.zoho.com/api/v1/public/channel/${zohoAppID}/widget`;
        s.onload = function (arg) {
          console.error("Script loaded:", arg);
        };
        s.onerror = function (error) {
          console.error("Script load error:", error);
        };
        document.getElementsByTagName("head")[0].appendChild(s);
      }

      window.addEventListener("DOMContentLoaded", initialize);

      console.log("end ---- index2.html");
    </script>
  </body>
</html>
